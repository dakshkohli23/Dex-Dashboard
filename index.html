<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectOS — Sign In</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

<div class="auth-container">
  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="auth-brand">
        <div class="auth-brand-icon"><i class="fas fa-layer-group"></i></div>
        <span class="auth-brand-name">ProjectOS</span>
      </div>
      <h1 class="auth-headline">Manage Every<br>Project with<br><em>Precision.</em></h1>
      <p class="auth-desc">From SEO campaigns to ad strategies — track, collaborate, and deliver exceptional results for every client.</p>
      <div class="auth-stats">
        <div class="auth-stat"><span class="auth-stat-num">∞</span><span class="auth-stat-label">Projects</span></div>
        <div class="auth-stat-div"></div>
        <div class="auth-stat"><span class="auth-stat-num">SEO</span><span class="auth-stat-label">Ads · Tools</span></div>
        <div class="auth-stat-div"></div>
        <div class="auth-stat"><span class="auth-stat-num">24/7</span><span class="auth-stat-label">Tracking</span></div>
      </div>
    </div>
    <div class="auth-deco">
      <div class="auth-grid"></div>
      <div class="auth-circle auth-circle-1"></div>
      <div class="auth-circle auth-circle-2"></div>
      <div class="auth-circle auth-circle-3"></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right">
    <div class="auth-form-wrap">
      <div class="auth-form-header">
        <h2 class="auth-form-title">Welcome back</h2>
        <p class="auth-form-subtitle">Sign in to your workspace</p>
      </div>

      <div id="auth-error" class="auth-error" style="display:none"></div>

      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-ico"></i>
            <input type="email" id="login-email" class="form-input has-ico" placeholder="you@company.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">
            Password
            <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
          </label>
          <div class="input-wrap">
            <i class="fas fa-lock input-ico"></i>
            <input type="password" id="login-password" class="form-input has-ico" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwd-toggle"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
          <span class="btn-txt">Sign In</span>
          <span class="btn-spin" style="display:none"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Need access? Contact your administrator.</p>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  // Check if already logged in
  firebase.auth().onAuthStateChanged(user => {
    if (user) window.location.href = 'app.html';
  });

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('auth-error');

    btn.querySelector('.btn-txt').style.display = 'none';
    btn.querySelector('.btn-spin').style.display = 'inline';
    btn.disabled = true; errEl.style.display = 'none';

    try {
      await signIn(email, password);
      window.location.href = 'app.html';
    } catch (err) {
      errEl.textContent = getAuthErrorMessage(err.code);
      errEl.style.display = 'block';
    } finally {
      btn.querySelector('.btn-txt').style.display = 'inline';
      btn.querySelector('.btn-spin').style.display = 'none';
      btn.disabled = false;
    }
  }

  // Password toggle
  document.getElementById('pwd-toggle').addEventListener('click', () => {
    const inp = document.getElementById('login-password');
    const ico = document.querySelector('#pwd-toggle i');
    if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fas fa-eye-slash'; }
    else { inp.type = 'password'; ico.className = 'fas fa-eye'; }
  });

  // Forgot password
  document.getElementById('forgot-link').addEventListener('click', async e => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    if (!email) { alert('Enter your email address first.'); return; }
    try {
      await sendPasswordReset(email);
      alert('Password reset email sent! Check your inbox.');
    } catch (err) { alert('Error: ' + err.message); }
  });
</script>
</body>
</html>
